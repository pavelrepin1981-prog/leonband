<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">LEON — сценический план</title>
  <desc id="desc">Схема расстановки на сцене: ударная установка, микшер, бас-гитара, гитара и стэки акустики. Минимальный размер сцены 5 на 5 метров, крыша обязательна, питание 220 вольт.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop stop-color="#11151a"/><stop offset="1" stop-color="#252b32"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e8ebed" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#101820" flood-opacity=".09"/></filter>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#171b20}.small{font-size:16px;letter-spacing:1.6px;font-weight:700}.label{font-size:20px;font-weight:700}.body{font-size:18px}.muted{fill:#6b737b}.lime{fill:#c6f52c}.outline{fill:#fff;stroke:#dce1e4;stroke-width:2}.equipment{fill:#f5f7f7;stroke:#222a31;stroke-width:3}.line{stroke:#c6f52c;stroke-width:6;stroke-linecap:round}.stageLabel{font-size:14px;letter-spacing:1.2px;font-weight:700}
    </style>
  </defs>
  <rect width="1600" height="1100" fill="#f3f5f5"/>
  <rect width="1600" height="180" fill="url(#header)"/>
  <rect x="72" y="58" width="10" height="70" rx="5" fill="#c6f52c"/>
  <text x="112" y="91" class="small" fill="#c6f52c">LEON  /  ТЕХНИЧЕСКИЙ РАЙДЕР</text>
  <text x="110" y="145" font-size="46" font-weight="800" fill="#fff">СЦЕНИЧЕСКИЙ ПЛАН</text>
  <text x="1525" y="103" text-anchor="end" class="small" fill="#fff">ВИД СВЕРХУ</text>
  <text x="1525" y="134" text-anchor="end" font-size="18" fill="#bbc2c8">СХЕМА РАССТАНОВКИ</text>

  <rect x="64" y="220" width="400" height="790" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="100" y="280" class="small muted">ТРЕБОВАНИЯ К ПЛОЩАДКЕ</text>
  <path d="M100 305H428" stroke="#e4e8ea" stroke-width="2"/>
  <g>
    <circle cx="124" cy="365" r="22" fill="#c6f52c"/><text x="124" y="372" text-anchor="middle" font-size="18" font-weight="800">01</text>
    <text x="164" y="359" font-size="18"><tspan x="164">Размер сцены —</tspan><tspan x="164" dy="26" font-weight="700">от 5 × 5 метров</tspan></text>
    <circle cx="124" cy="475" r="22" fill="#c6f52c"/><text x="124" y="482" text-anchor="middle" font-size="18" font-weight="800">02</text>
    <text x="164" y="454" font-size="18">Музыканты</text><text x="164" y="480" font-size="18">за линией фронтлайна</text>
    <circle cx="124" cy="585" r="22" fill="#c6f52c"/><text x="124" y="592" text-anchor="middle" font-size="18" font-weight="800">03</text>
    <text x="164" y="592" font-size="18">Сцена должна иметь крышу</text>
    <circle cx="124" cy="695" r="22" fill="#c6f52c"/><text x="124" y="702" text-anchor="middle" font-size="18" font-weight="800">04</text>
    <text x="164" y="680" font-size="18">Источник питания</text><text x="164" y="706" font-size="18" font-weight="700">220 В на сцене</text>
  </g>
  <rect x="96" y="795" width="336" height="168" rx="14" fill="#171b20"/>
  <text x="124" y="838" class="small lime">ВАЖНО</text>
  <text x="124" y="865" font-size="17" fill="#fff">Схема условная.</text>
  <text x="124" y="892" font-size="17" fill="#fff">Позиции согласовать с площадкой.</text>

  <rect x="500" y="220" width="1036" height="790" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="540" y="278" class="small muted">РАССТАНОВКА ОБОРУДОВАНИЯ</text>
  <text x="1495" y="278" text-anchor="end" class="small muted">СХЕМА НЕ В МАСШТАБЕ · ≥ 5 × 5 М</text>
  <rect x="560" y="330" width="916" height="575" rx="12" fill="url(#grid)" stroke="#aeb7bd" stroke-width="3"/>
  <rect x="560" y="330" width="916" height="575" rx="12" fill="none" stroke="#aeb7bd" stroke-width="3"/>
  <path d="M560 313V300H1476V313" fill="none" stroke="#6b737b" stroke-width="2"/>
  <text x="1018" y="296" text-anchor="middle" class="stageLabel muted">ШИРИНА СЦЕНЫ ≥ 5 М</text>
  <path d="M548 330H535V905H548" fill="none" stroke="#6b737b" stroke-width="2"/>
  <text x="522" y="620" text-anchor="middle" class="stageLabel muted" transform="rotate(-90 522 620)">ГЛУБИНА СЦЕНЫ ≥ 5 М</text>
  <rect x="580" y="347" width="876" height="47" rx="8" fill="#171b20"/>
  <path d="M602 370H1434" class="line"/>
  <rect x="902" y="351" width="232" height="38" rx="19" fill="#171b20"/>
  <text x="1018" y="376" text-anchor="middle" class="stageLabel" fill="#fff">КРЫША НАД СЦЕНОЙ</text>

  <g transform="translate(950 462)">
    <circle cx="0" cy="42" r="35" class="equipment"/><circle cx="0" cy="42" r="20" fill="#dce1e4" stroke="#222a31" stroke-width="2"/>
    <ellipse cx="-64" cy="0" rx="39" ry="10" fill="#dce1e4" stroke="#222a31" stroke-width="2"/><path d="M-64 10V68M-80 72L-64 66-48 72" fill="none" stroke="#222a31" stroke-width="3"/>
    <ellipse cx="64" cy="0" rx="39" ry="10" fill="#dce1e4" stroke="#222a31" stroke-width="2"/><path d="M64 10V68M48 72L64 66 80 72" fill="none" stroke="#222a31" stroke-width="3"/>
    <circle cx="-28" cy="-4" r="17" class="equipment"/><circle cx="28" cy="-4" r="17" class="equipment"/>
    <circle cx="0" cy="-29" r="14" class="equipment"/><path d="M-28 13V39M28 13V39" stroke="#222a31" stroke-width="3"/>
    <text x="0" y="102" text-anchor="middle" class="label">УДАРНАЯ УСТАНОВКА</text>
  </g>

  <g transform="translate(1285 430)">
    <rect x="-65" y="-24" width="130" height="70" rx="8" fill="#171b20"/>
    <path d="M-48 -7H48M-48 5H48M-48 17H48" stroke="#c6f52c" stroke-width="3"/>
    <g fill="#fff"><circle cx="-42" cy="-7" r="3"/><circle cx="-24" cy="-7" r="3"/><circle cx="-6" cy="-7" r="3"/><circle cx="12" cy="-7" r="3"/><circle cx="30" cy="-7" r="3"/><circle cx="-42" cy="5" r="3"/><circle cx="-24" cy="5" r="3"/><circle cx="-6" cy="5" r="3"/><circle cx="12" cy="5" r="3"/><circle cx="30" cy="5" r="3"/></g>
    <text x="0" y="78" text-anchor="middle" class="label">МИКШЕР</text>
  </g>

  <g transform="translate(755 600)">
    <circle cx="0" cy="-43" r="17" fill="#252b32"/><path d="M-25 -20Q0 -34 25 -20L32 20H-32Z" fill="#252b32"/>
    <path d="M10 -3L63 22Q74 27 66 34L12 11Z" fill="#c6f52c" stroke="#252b32" stroke-width="3"/>
    <rect x="39" y="20" width="48" height="7" rx="3" transform="rotate(22 39 20)" fill="#252b32"/>
    <text x="0" y="73" text-anchor="middle" class="label">БАС-ГИТАРА</text>
  </g>
  <g transform="translate(1110 600)">
    <circle cx="0" cy="-43" r="17" fill="#252b32"/><path d="M-25 -20Q0 -34 25 -20L32 20H-32Z" fill="#252b32"/>
    <path d="M7 -3L60 20Q72 25 64 34L9 12Z" fill="#c6f52c" stroke="#252b32" stroke-width="3"/>
    <rect x="38" y="18" width="50" height="7" rx="3" transform="rotate(22 38 18)" fill="#252b32"/>
    <text x="0" y="73" text-anchor="middle" class="label">ГИТАРА</text>
  </g>
  <g transform="translate(1235 590)" fill="none" stroke="#252b32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 7V80M-18 80H18M-14 80L0 65 14 80M0 7L-10 -4"/>
    <rect x="-17" y="-19" width="10" height="22" rx="5" fill="#c6f52c" transform="rotate(-24 -12 -8)"/>
  </g>
  <text x="1235" y="687" text-anchor="middle" class="stageLabel">МИКРОФОН</text>

  <g transform="translate(620 650)">
    <rect x="-32" y="-55" width="64" height="55" rx="5" fill="#252b32"/><circle cx="0" cy="-28" r="13" fill="#58616a"/><rect x="-38" y="3" width="76" height="42" rx="5" fill="#252b32"/><circle cx="0" cy="24" r="13" fill="#58616a"/>
    <rect x="-38" y="51" width="76" height="42" rx="5" fill="#252b32"/><circle cx="0" cy="72" r="13" fill="#58616a"/>
    <text x="0" y="120" text-anchor="middle" class="stageLabel">ПОРТАЛ L</text>
  </g>
  <g transform="translate(1415 650)">
    <rect x="-32" y="-55" width="64" height="55" rx="5" fill="#252b32"/><circle cx="0" cy="-28" r="13" fill="#58616a"/><rect x="-38" y="3" width="76" height="42" rx="5" fill="#252b32"/><circle cx="0" cy="24" r="13" fill="#58616a"/>
    <rect x="-38" y="51" width="76" height="42" rx="5" fill="#252b32"/><circle cx="0" cy="72" r="13" fill="#58616a"/>
    <text x="0" y="120" text-anchor="middle" class="stageLabel">ПОРТАЛ R</text>
  </g>

  <path d="M660 790H1375" stroke="#ff5c4d" stroke-width="4" stroke-dasharray="12 10"/>
  <rect x="875" y="770" width="286" height="40" rx="20" fill="#fff" stroke="#ff5c4d" stroke-width="2"/>
  <text x="1018" y="796" text-anchor="middle" class="stageLabel" fill="#c74338">ЛИНИЯ ФРОНТЛАЙНА</text>
  <text x="1018" y="857" text-anchor="middle" class="small muted">ЗРИТЕЛЬНЫЙ ЗАЛ / ПЕРЕД СЦЕНОЙ</text>
  <g transform="translate(1410 850)"><circle cx="0" cy="0" r="24" fill="#c6f52c"/><path d="M0 12V-10M-8 -2L0 -10 8 -2" fill="none" stroke="#171b20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="-40" y="7" text-anchor="end" class="stageLabel">220 В</text></g>
  <text x="64" y="1060" class="stageLabel muted">LEON  •  СЦЕНИЧЕСКАЯ СХЕМА</text>
  <text x="1536" y="1060" text-anchor="end" class="stageLabel muted">РАССТАНОВКА УТОЧНЯЕТСЯ ПО ПЛОЩАДКЕ</text>
</svg>
